<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Match Info</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Dota 2 Match Information</h1>
    <input id="matchId" type="text" placeholder="Type Match ID">
    <button onclick="GetMatchId()">Get Data</button>
    <div class="match-container">
        <h2 id="winner"></h2>
        <div class="marker">
            <h3 class="killQuantity" id="radiantKills"></h3>
            <h3 id="matchDuration"></h3>
            <h3 class="killQuantity" id="direKills"></h3>
        </div>
        <div class="teams">
            <div id="radiant" class="team radiant">
                <h3>Radiant</h3>
            </div>
            <div id="dire" class="team dire">
                <h3>Dire</h3>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
